name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (scoring engine and quality gate)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (desktop and mobile viewports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser Playwright needs
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Seed a database to run the walkthrough against
        run: EXAMOS_DATA_DIR="$PWD/.demo-data" npm run seed:demo

      - name: Run the suite
        run: npx playwright test
        env:
          EXAMOS_TEST_DATA_DIR: ${{ github.workspace }}/.demo-data

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
